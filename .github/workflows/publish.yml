name: Publish

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: prod

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 24

    - name: Build
      run: |
        npm install
        npm run build

  deployment:
    runs-on: prod
    environment: apps

    steps:
      - name: Deploy
        run: rsync -avrc --delete dist/ ${{ secrets.TARGET }}
